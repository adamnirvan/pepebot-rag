services:
  postgres-db:
    image: pgvector/pgvector:pg15
    container_name: pepebot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE wajib diisi}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-service:
    build:
      context: ./core-service
    container_name: pepebot_core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./core-service/.env
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      postgres-db:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    container_name: pepebot_ai
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres-db:5432/${DB_DATABASE}
    depends_on:
      postgres-db:
        condition: service_healthy

  waha:
    image: devlikeapro/waha
    container_name: pepebot_waha
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./waha_data:/app/.waha
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_HOOK_URL: http://core-service:8000/api/webhook/whatsapp
      WHATSAPP_HOOK_EVENTS: message
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY wajib diisi}

volumes:
  pgdata:
